project:
  name: somali-nlp-research
  seed: 42
paths:
  data_raw: data/raw/full_dataset.csv
  data_labeled: data/raw/labeled_text.xlsx
  experiments_dir: experiments
  experiment_1_dir: experiments/experiment_1_stopwords_included
  experiment_2_dir: experiments/experiment_2_stopwords_removed
  data_processed_dir: experiments\experiment_1_stopwords_included\data
  eda_figures_dir: experiments\experiment_1_stopwords_included\eda\figures
  traditional_ml_models_dir: experiments\experiment_1_stopwords_included\models\traditional_ml
  evaluation_reports_dir: experiments\experiment_1_stopwords_included\evaluation\reports
  evaluation_figures_dir: experiments\experiment_1_stopwords_included\evaluation\figures
  xai_outputs_dir: experiments\experiment_1_stopwords_included\xai\outputs
  results_dir: experiments\experiment_1_stopwords_included\results
data:
  dataset_labeled: data/raw/labeled_text.xlsx
  supplemental_raw: data/raw/full_dataset.csv
  text_column: Text
  label_column: Label
  train_file: clean_train.csv
  val_file: clean_val.csv
  test_file: clean_test.csv
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true
preprocessing:
  lowercase: true
  normalize_whitespace: true
  remove_urls: true
  remove_emails: true
traditional_ml:
  final_model_train_scope: full_dataset
  task: binary_ai_vs_human
  default_models:
  - LogisticRegression_TFIDF
  - LinearSVC_TFIDF
  optional_models:
  - RandomForest_TFIDF
  - XGBoost_TFIDF
