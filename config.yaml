project:
  name: somali-nlp-research
  seed: 42            # split-ka si uu mar walba isku mid u noqdo

paths:
  data_raw: data/raw/full_dataset.csv
  data_processed_dir: data/processed
  data_annotations_dir: data/annotations
  eda_figures_dir: eda/figures
  traditional_ml_results_dir: models/traditional_ml/results
  deep_learning_logs_dir: models/deep_learning/training_logs
  deep_learning_checkpoints_dir: models/deep_learning/checkpoints
  transformer_logs_dir: models/transformers/training_logs
  transformer_checkpoints_dir: models/transformers/checkpoints

data:
  # labeled dataset aad ku shaqaynayso (AI vs HUMAN)
  dataset_labeled: data/annotations/labeled_ai_human.csv

  # columns-ka saxda ah ee file-kaas
  text_column: Text
  label_column: Label

  # outputs
  train_file: clean_train.csv
  val_file: clean_val.csv
  test_file: clean_test.csv

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true      # AI/HUMAN ratio ha ilaaliyo splits

preprocessing:
  lowercase: true
  normalize_whitespace: true
  remove_urls: true
  remove_emails: true

tokenization:
  model_name: xlm-roberta-base
  max_length: 256
  truncation: true
  padding: max_length

deep_learning:
  max_tokens: 30000
  embedding_dim: 200
  lstm_units_1: 128
  lstm_units_2: 64
  dropout_1: 0.5
  dropout_2: 0.3
  dense_units: 64
  batch_size: 64
  epochs: 8
  patience: 2
  learning_rate: 0.001
  trainable_embeddings: false

transformers:
  models:
    mbert: bert-base-multilingual-cased
    xlmr: xlm-roberta-base
    somberta: shuabdaud/SomBERTa
    afroxlmr: Davlan/afro-xlmr-base
    afriberta: castorini/afriberta_base
  num_labels: 2
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  epochs: 3
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  early_stopping_patience: 2
  save_total_limit: 2
  logging_steps: 25
  metric_for_best_model: f1
  greater_is_better: true
  fp16: false
