server {
    listen 80;
    listen [::]:80;
    server_name _;

    # A pasted thesis or an uploaded PDF can be large, and the platform accepts
    # both without a length cap; nginx must not be the thing that refuses them.
    client_max_body_size 100M;

    root __APP_DIR__/web/frontend/dist;
    index index.html;

    # The built frontend is 1.2 MB of hashed assets: safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold transformer takes a few seconds to load on first use, and a link
        # analysis fetches a remote article before it classifies it. The default
        # 60 s would cut both off mid-flight.
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
